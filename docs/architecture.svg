<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1100" height="640" fill="#f7f8fa"/>

  <!-- header -->
  <text x="50" y="52" font-size="30" font-weight="700" fill="#1e293b">Nova<tspan font-weight="400" fill="#475569"> · Architecture</tspan></text>
  <text x="50" y="78" font-size="13.5" fill="#64748b">终端编码智能体运行时 · TypeScript / Node 单仓多包 (pnpm monorepo) · CLI 二进制 nova · v0.1.0</text>

  <!-- ===================== BANDS ===================== -->
  <!-- band tints -->
  <rect x="210" y="100"  width="850" height="80"  rx="14" fill="#4f46e5" opacity="0.045"/>
  <rect x="210" y="200"  width="850" height="80"  rx="14" fill="#7c3aed" opacity="0.045"/>
  <rect x="210" y="300"  width="850" height="98"  rx="14" fill="#0d9488" opacity="0.05"/>
  <rect x="210" y="418"  width="850" height="98"  rx="14" fill="#d97706" opacity="0.05"/>

  <!-- ===================== LEFT RAIL LABELS ===================== -->
  <g text-anchor="end">
    <rect x="178" y="128" width="6" height="24" rx="3" fill="#4f46e5"/>
    <text x="166" y="139" font-size="13" font-weight="700" fill="#4f46e5">APPLICATION</text>
    <text x="166" y="156" font-size="10.5" fill="#94a3b8">应用层</text>

    <rect x="178" y="228" width="6" height="24" rx="3" fill="#7c3aed"/>
    <text x="166" y="239" font-size="13" font-weight="700" fill="#7c3aed">ORCHESTRATION</text>
    <text x="166" y="256" font-size="10.5" fill="#94a3b8">编排层</text>

    <rect x="178" y="337" width="6" height="24" rx="3" fill="#0d9488"/>
    <text x="166" y="348" font-size="13" font-weight="700" fill="#0d9488">CAPABILITIES</text>
    <text x="166" y="365" font-size="10.5" fill="#94a3b8">能力层</text>

    <rect x="178" y="455" width="6" height="24" rx="3" fill="#d97706"/>
    <text x="166" y="466" font-size="13" font-weight="700" fill="#d97706">FOUNDATION</text>
    <text x="166" y="483" font-size="10.5" fill="#94a3b8">基础层 (leaf)</text>
  </g>

  <!-- ===================== APPLICATION ===================== -->
  <g filter="url(#card-shadow)">
    <rect x="430" y="112" width="410" height="56" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  </g>
  <text x="635" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">apps/cli</text>
  <text x="635" y="154" text-anchor="middle" font-size="11" fill="#64748b">交互式 TUI · 权限模式 · 斜杠命令 · nova 二进制</text>

  <!-- ===================== ORCHESTRATION ===================== -->
  <g filter="url(#card-shadow)">
    <rect x="370" y="212" width="250" height="56" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <rect x="650" y="212" width="250" height="56" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5"/>
  </g>
  <text x="495" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">subagent</text>
  <text x="495" y="254" text-anchor="middle" font-size="10.5" fill="#64748b">嵌套子智能体</text>
  <text x="775" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">agent</text>
  <text x="775" y="254" text-anchor="middle" font-size="10.5" fill="#64748b">createAgent · 默认 hooks 装配</text>

  <!-- ===================== CAPABILITIES ===================== -->
  <g filter="url(#card-shadow)">
    <rect x="225" y="312" width="152" height="74" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="392" y="312" width="152" height="74" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="559" y="312" width="152" height="74" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="726" y="312" width="152" height="74" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
    <rect x="893" y="312" width="152" height="74" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle">
    <text x="301" y="345" font-size="14" font-weight="700" fill="#1e293b">tools</text>
    <text x="301" y="362" font-size="10" fill="#64748b">read/edit/bash</text>
    <text x="301" y="375" font-size="10" fill="#64748b">分发 · 不变量门禁</text>

    <text x="468" y="345" font-size="14" font-weight="700" fill="#1e293b">context</text>
    <text x="468" y="362" font-size="10" fill="#64748b">记忆束 · 压缩</text>
    <text x="468" y="375" font-size="10" fill="#64748b">memory bundle</text>

    <text x="635" y="345" font-size="14" font-weight="700" fill="#1e293b">safety</text>
    <text x="635" y="362" font-size="10" fill="#64748b">权限门禁</text>
    <text x="635" y="375" font-size="10" fill="#64748b">permission gate</text>

    <text x="802" y="345" font-size="14" font-weight="700" fill="#1e293b">sandbox</text>
    <text x="802" y="362" font-size="10" fill="#64748b">OS 写入隔离</text>
    <text x="802" y="375" font-size="10" fill="#64748b">Seatbelt/bwrap</text>

    <text x="969" y="345" font-size="14" font-weight="700" fill="#1e293b">external</text>
    <text x="969" y="362" font-size="10" fill="#64748b">MCP 客户端</text>
    <text x="969" y="375" font-size="10" fill="#64748b">外部工具接入</text>
  </g>

  <!-- ===================== FOUNDATION ===================== -->
  <g filter="url(#card-shadow)">
    <rect x="236" y="430" width="180" height="74" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="442" y="430" width="180" height="74" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="648" y="430" width="180" height="74" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <rect x="854" y="430" width="180" height="74" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle">
    <text x="326" y="462" font-size="14.5" font-weight="700" fill="#1e293b">core</text>
    <text x="326" y="480" font-size="10" fill="#64748b">模型无关循环</text>
    <text x="326" y="493" font-size="10" fill="#64748b">HookRegistry · 契约</text>

    <text x="532" y="462" font-size="14.5" font-weight="700" fill="#1e293b">runtime</text>
    <text x="532" y="480" font-size="10" fill="#64748b">配置 (zod) · 会话</text>
    <text x="532" y="493" font-size="10" fill="#64748b">~/.nova</text>

    <text x="738" y="462" font-size="14.5" font-weight="700" fill="#1e293b">observability</text>
    <text x="738" y="480" font-size="10" fill="#64748b">transcript</text>
    <text x="738" y="493" font-size="10" fill="#64748b">事件 · 指标</text>

    <text x="944" y="462" font-size="14.5" font-weight="700" fill="#1e293b">lsp</text>
    <text x="944" y="480" font-size="10" fill="#64748b">语言服务多路复用</text>
    <text x="944" y="493" font-size="10" fill="#64748b">代码智能</text>
  </g>

  <!-- ===================== DEPENDENCY ARROWS (flow downward) ===================== -->
  <g stroke="#94a3b8" stroke-width="1.6" fill="none" opacity="0.7">
    <line x1="635" y1="168" x2="635" y2="210" marker-end="url(#arrow)"/>
    <line x1="635" y1="268" x2="635" y2="310" marker-end="url(#arrow)"/>
    <line x1="635" y1="386" x2="635" y2="428" marker-end="url(#arrow)"/>
  </g>

  <!-- ===================== FOOTER NOTE ===================== -->
  <g>
    <rect x="50" y="548" width="1000" height="62" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <circle cx="74" cy="571" r="4" fill="#4f46e5"/>
    <text x="88" y="575" font-size="11.5" fill="#475569">依赖方向严格自上而下；<tspan font-weight="700" fill="#1e293b">@nova/core</tspan> 模型无关，不导入任何模型 SDK / 工具实现 / UI。</text>
    <circle cx="74" cy="592" r="4" fill="#0d9488"/>
    <text x="88" y="596" font-size="11.5" fill="#475569">核心循环 (loop.ts) 唯一扩展点为 HookRegistry：权限、压缩、transcript、UI 更新均以 hook 形式挂载。messages 仅追加 (append-only)。</text>
  </g>
</svg>
