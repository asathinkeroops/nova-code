<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="890" viewBox="0 0 1280 890" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#1e293b" flood-opacity="0.07"/>
    </filter>
    <marker id="flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="tap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="890" fill="#f7f8fa"/>

  <!-- ============ HEADER ============ -->
  <text x="48" y="52" font-size="29" font-weight="700" fill="#1e293b">Nova · Agent Loop<tspan font-weight="400" fill="#475569"> &amp; Hook 扩展机制</tspan></text>
  <text x="48" y="78" font-size="13.5" fill="#64748b">packages/core · agentLoop (loop.ts) 在每个生命周期点触发具名事件 → HookRegistry → 订阅者。循环唯一的扩展点就是 hooks。</text>

  <!-- legend -->
  <g>
    <rect x="48" y="96" width="804" height="30" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="66" y="115" font-size="11.5" fill="#334155"><tspan font-weight="700" fill="#4f46e5">◆ blocking</tspan>：可改写 / 否决，首个非 undefined 生效，异常向上抛出</text>
    <text x="524" y="115" font-size="11.5" fill="#334155"><tspan font-weight="700" fill="#0d9488">○ advisory</tspan>：只观察，best-effort，异常被吞掉</text>
  </g>

  <!-- ============ LOOP PIPELINE (left) ============ -->
  <!-- loop container -->
  <rect x="110" y="192" width="320" height="592" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="124" y="210" font-size="11" font-weight="700" fill="#94a3b8">agentLoop · while (true)</text>

  <!-- entry: pre_user_prompt -->
  <g filter="url(#sh)"><rect x="130" y="138" width="280" height="44" rx="9" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.4"/></g>
  <text x="142" y="158" font-size="12.5" font-weight="700" fill="#1e293b">user prompt  <tspan font-size="9.5" font-weight="400" fill="#94a3b8">turn 级 · 每 turn 一次 · 在 while 之外</tspan></text>
  <text x="142" y="173" font-size="10.5"><tspan fill="#4f46e5" font-weight="600">◆ pre_user_prompt</tspan><tspan fill="#64748b">  改写输入 / 否决整个 turn</tspan></text>

  <!-- S1 pre_compact -->
  <g filter="url(#sh)"><rect x="130" y="224" width="280" height="46" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/></g>
  <text x="142" y="244" font-size="12.5" font-weight="700" fill="#1e293b">compact history</text>
  <text x="142" y="260" font-size="10.5"><tspan fill="#4f46e5" font-weight="600">◆ pre_compact</tspan><tspan fill="#64748b">  替换工作历史 → </tspan><tspan fill="#0d9488" font-weight="600">○ post_compact</tspan></text>

  <!-- S2 pre_request -->
  <g filter="url(#sh)"><rect x="130" y="282" width="280" height="46" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/></g>
  <text x="142" y="302" font-size="12.5" font-weight="700" fill="#1e293b">build request</text>
  <text x="142" y="318" font-size="10"><tspan fill="#4f46e5" font-weight="600">◆ pre_request</tspan><tspan fill="#64748b">  覆写 system·messages·tools·maxTokens</tspan></text>

  <!-- S3 model.call -->
  <g filter="url(#sh)"><rect x="130" y="340" width="280" height="52" rx="9" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6"/></g>
  <text x="142" y="362" font-size="13.5" font-weight="700" fill="#9a3412">model.call  ⟶  LLM</text>
  <text x="142" y="380" font-size="10.5" fill="#b45309">ModelClient · DeepSeek / provider（流式响应）</text>

  <!-- S4 assistant turn -->
  <g filter="url(#sh)"><rect x="130" y="404" width="280" height="44" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/></g>
  <text x="142" y="424" font-size="12.5" font-weight="700" fill="#1e293b">assistant turn</text>
  <text x="142" y="439" font-size="10.5"><tspan fill="#0d9488" font-weight="600">○ post_request</tspan><tspan fill="#64748b"> · </tspan><tspan fill="#0d9488" font-weight="600">○ post_assistant</tspan></text>

  <!-- S5 stop decision -->
  <g filter="url(#sh)"><rect x="130" y="460" width="280" height="52" rx="9" fill="#fefce8" stroke="#fde68a" stroke-width="1.6"/></g>
  <text x="142" y="481" font-size="12.5" font-weight="700" fill="#854d0e">stop decision</text>
  <text x="142" y="498" font-size="10.5"><tspan fill="#a16207">decide() → continue · return · truncated  </tspan><tspan fill="#0d9488" font-weight="600">○ post_stop</tspan></text>

  <!-- S6 permission gate -->
  <g filter="url(#sh)"><rect x="130" y="524" width="280" height="60" rx="9" fill="#ffffff" stroke="#a5b4fc" stroke-width="1.8"/></g>
  <text x="142" y="544" font-size="12.5" font-weight="700" fill="#1e293b">permission gate  <tspan font-weight="400" fill="#94a3b8">每个 tool_use</tspan></text>
  <text x="142" y="560" font-size="10.5"><tspan fill="#4f46e5" font-weight="700">◆ pre_tool_use</tspan><tspan fill="#64748b">  唯一权限闸门 → allow:false 即 deny</tspan></text>
  <text x="142" y="575" font-size="10.5"><tspan fill="#0d9488" font-weight="600">○ pre_permission</tspan><tspan fill="#64748b"> · </tspan><tspan fill="#0d9488" font-weight="600">○ post_permission</tspan></text>

  <!-- S7 execute tools -->
  <g filter="url(#sh)"><rect x="130" y="596" width="280" height="44" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/></g>
  <text x="142" y="616" font-size="12.5" font-weight="700" fill="#1e293b">execute tools  <tspan font-weight="400" fill="#94a3b8">(并发)</tspan></text>
  <text x="142" y="631" font-size="10.5" fill="#64748b">toolConcurrency · read / edit / bash / lsp / mcp</text>

  <!-- S8 tool result -->
  <g filter="url(#sh)"><rect x="130" y="652" width="280" height="46" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/></g>
  <text x="142" y="672" font-size="12.5" font-weight="700" fill="#1e293b">tool result</text>
  <text x="142" y="688" font-size="10.5"><tspan fill="#4f46e5" font-weight="600">◆ post_tool_use</tspan><tspan fill="#64748b"> 改写结果 · </tspan><tspan fill="#0d9488" font-weight="600">○ post_user_message</tspan></text>

  <!-- S9 pre_continue -->
  <g filter="url(#sh)"><rect x="130" y="710" width="280" height="46" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/></g>
  <text x="142" y="730" font-size="12.5" font-weight="700" fill="#1e293b">iteration boundary</text>
  <text x="142" y="746" font-size="10.5"><tspan fill="#4f46e5" font-weight="600">◆ pre_continue</tspan><tspan fill="#64748b">  注入额外消息（如 todo 提醒）</tspan></text>

  <!-- exit: post_turn / error -->
  <g filter="url(#sh)"><rect x="130" y="794" width="280" height="46" rx="9" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.4"/></g>
  <text x="142" y="814" font-size="12.5" font-weight="700" fill="#1e293b">turn end</text>
  <text x="142" y="830" font-size="10.5"><tspan fill="#0d9488" font-weight="600">○ post_turn</tspan><tspan fill="#64748b"> · </tspan><tspan fill="#0d9488" font-weight="600">○ error</tspan><tspan fill="#94a3b8">   由 @nova/agent 包裹 loop 触发</tspan></text>

  <!-- ===== flow down-arrows ===== -->
  <g stroke="#64748b" stroke-width="1.6" fill="none">
    <line x1="270" y1="182" x2="270" y2="222" marker-end="url(#flow)"/>
    <line x1="270" y1="270" x2="270" y2="280" marker-end="url(#flow)"/>
    <line x1="270" y1="328" x2="270" y2="338" marker-end="url(#flow)"/>
    <line x1="270" y1="392" x2="270" y2="402" marker-end="url(#flow)"/>
    <line x1="270" y1="448" x2="270" y2="458" marker-end="url(#flow)"/>
    <line x1="270" y1="512" x2="270" y2="522" marker-end="url(#flow)"/>
    <line x1="270" y1="584" x2="270" y2="594" marker-end="url(#flow)"/>
    <line x1="270" y1="640" x2="270" y2="650" marker-end="url(#flow)"/>
    <line x1="270" y1="698" x2="270" y2="708" marker-end="url(#flow)"/>
  </g>

  <!-- ===== loop-back arrow (pre_continue → pre_compact) ===== -->
  <path d="M130,733 L96,733 L96,247 L130,247" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#back)"/>
  <text x="78" y="490" font-size="11" font-weight="700" fill="#7c3aed" transform="rotate(-90 78 490)" text-anchor="middle">loop ↻ 下一次迭代</text>

  <!-- ===== early return arrow (stop → turn end) ===== -->
  <path d="M130,486 L64,486 L64,817 L130,817" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#flow)"/>
  <text x="48" y="690" font-size="10.5" fill="#94a3b8" transform="rotate(-90 48 690)" text-anchor="middle">return / throw → 退出</text>

  <!-- ============ EVENT BUS → REGISTRY ============ -->
  <!-- vertical bus -->
  <line x1="462" y1="160" x2="462" y2="735" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 4"/>
  <!-- stubs from each step right edge to bus -->
  <g stroke="#a78bfa" stroke-width="1.3" stroke-dasharray="4 4" opacity="0.85">
    <line x1="410" y1="160" x2="462" y2="160"/>
    <line x1="410" y1="247" x2="462" y2="247"/>
    <line x1="410" y1="305" x2="462" y2="305"/>
    <line x1="410" y1="366" x2="462" y2="366"/>
    <line x1="410" y1="426" x2="462" y2="426"/>
    <line x1="410" y1="486" x2="462" y2="486"/>
    <line x1="410" y1="554" x2="462" y2="554"/>
    <line x1="410" y1="675" x2="462" y2="675"/>
    <line x1="410" y1="733" x2="462" y2="733"/>
  </g>
  <!-- bus → registry -->
  <path d="M462,490 L552,490" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#tap)"/>
  <text x="507" y="481" font-size="10.5" font-weight="600" fill="#7c3aed" text-anchor="middle">fires</text>

  <!-- ============ HOOK REGISTRY (center) ============ -->
  <g filter="url(#sh)"><rect x="556" y="326" width="222" height="336" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6"/></g>
  <text x="667" y="358" font-size="16" font-weight="700" fill="#6d28d9" text-anchor="middle">HookRegistry</text>
  <text x="667" y="376" font-size="10" fill="#7c3aed" text-anchor="middle">循环唯一扩展点 · 类型化 pub/sub</text>

  <!-- runBlocking -->
  <rect x="572" y="392" width="190" height="92" rx="10" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.3"/>
  <text x="584" y="412" font-size="12" font-weight="700" fill="#4f46e5">runBlocking(point)</text>
  <text x="584" y="430" font-size="10" fill="#475569">按序触发，首个非 undefined</text>
  <text x="584" y="444" font-size="10" fill="#475569">短路生效</text>
  <text x="584" y="462" font-size="10" fill="#475569">→ 可改写 / 否决</text>
  <text x="584" y="476" font-size="10" fill="#475569">→ 异常向上抛出</text>

  <!-- runAdvisory -->
  <rect x="572" y="494" width="190" height="92" rx="10" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.3"/>
  <text x="584" y="514" font-size="12" font-weight="700" fill="#0d9488">runAdvisory(point)</text>
  <text x="584" y="532" font-size="10" fill="#475569">全部按序触发</text>
  <text x="584" y="550" font-size="10" fill="#475569">→ 返回值丢弃 · 不可改状态</text>
  <text x="584" y="564" font-size="10" fill="#475569">→ 异常被吞（onError 上报）</text>

  <!-- on() -->
  <rect x="572" y="598" width="190" height="46" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="667" y="618" font-size="11.5" font-weight="700" fill="#1e293b" text-anchor="middle">on(point, fn)</text>
  <text x="667" y="633" font-size="9.5" fill="#64748b" text-anchor="middle">注册订阅，返回 unsubscribe</text>

  <!-- registry → subscribers -->
  <path d="M778,490 L808,490" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#tap)"/>

  <!-- ============ SUBSCRIBERS (right) ============ -->
  <rect x="810" y="200" width="436" height="556" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="830" y="232" font-size="15" font-weight="700" fill="#1e293b">Subscribers <tspan font-size="11" font-weight="400" fill="#94a3b8">监听具体 hook point 的回调</tspan></text>

  <!-- Group A: defaults -->
  <text x="830" y="262" font-size="11.5" font-weight="700" fill="#475569">默认 · @nova/agent createAgent() 装配</text>
  <g font-size="11">
    <rect x="828" y="272" width="194" height="56" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="842" cy="290" r="4" fill="#4f46e5"/>
    <text x="854" y="294" font-weight="700" fill="#1e293b">权限闸门</text>
    <text x="840" y="316" font-size="10" fill="#4f46e5">◆ pre_tool_use</text>

    <rect x="1040" y="272" width="194" height="56" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="1054" cy="290" r="4" fill="#4f46e5"/>
    <text x="1066" y="294" font-weight="700" fill="#1e293b">上下文压缩</text>
    <text x="1052" y="316" font-size="10" fill="#4f46e5">◆ pre_compact</text>

    <rect x="828" y="336" width="194" height="56" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="842" cy="354" r="4" fill="#0d9488"/>
    <text x="854" y="358" font-weight="700" fill="#1e293b">Transcript 写入</text>
    <text x="840" y="380" font-size="10" fill="#0d9488">○ post_*  → transcript.jsonl</text>

    <rect x="1040" y="336" width="194" height="56" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="1054" cy="354" r="4" fill="#0d9488"/>
    <text x="1066" y="358" font-weight="700" fill="#1e293b">TUI / UI 渲染</text>
    <text x="1052" y="380" font-size="10" fill="#0d9488">○ post_messages</text>
  </g>

  <!-- Group B: custom -->
  <text x="830" y="430" font-size="11.5" font-weight="700" fill="#475569">自定义 · agent.on(point, fn)</text>
  <g font-size="11">
    <rect x="828" y="440" width="194" height="56" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="842" cy="458" r="4" fill="#4f46e5"/>
    <text x="854" y="462" font-weight="700" fill="#1e293b">Todo 提醒注入</text>
    <text x="840" y="484" font-size="10" fill="#4f46e5">◆ pre_continue</text>

    <rect x="1040" y="440" width="194" height="56" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="1054" cy="458" r="4" fill="#4f46e5"/>
    <text x="1066" y="462" font-weight="700" fill="#1e293b">结果脱敏 / 截断</text>
    <text x="1052" y="484" font-size="10" fill="#4f46e5">◆ post_tool_use</text>

    <rect x="828" y="504" width="194" height="56" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="842" cy="522" r="4" fill="#0d9488"/>
    <text x="854" y="526" font-weight="700" fill="#1e293b">指标 / 用量</text>
    <text x="840" y="548" font-size="10" fill="#0d9488">○ post_request</text>

    <rect x="1040" y="504" width="194" height="56" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <circle cx="1054" cy="522" r="4" fill="#0d9488"/>
    <text x="1066" y="526" font-weight="700" fill="#1e293b">请求改写策略</text>
    <text x="1052" y="548" font-size="10" fill="#4f46e5">◆ pre_request</text>
  </g>

  <!-- ambient note -->
  <rect x="828" y="584" width="406" height="68" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="844" y="606" font-size="11" font-weight="700" fill="#6d28d9">环境事件</text>
  <text x="844" y="624" font-size="10.5"><tspan fill="#0d9488" font-weight="600">○ post_messages</tspan><tspan fill="#475569"> 在 messages 每次变更时触发；历史</tspan></text>
  <text x="844" y="640" font-size="10.5" fill="#475569">严格 append-only，仅 pre_compact 可整体替换。</text>

  <text x="830" y="690" font-size="10.5" fill="#94a3b8">阻塞钩子：pre_user_prompt · pre_compact · pre_request · pre_tool_use ·</text>
  <text x="830" y="706" font-size="10.5" fill="#94a3b8">post_tool_use · pre_continue。其余均为 advisory（只读观察）。</text>
  <text x="830" y="730" font-size="10.5" fill="#94a3b8">每个 tool_use 必配对一个 tool_result（dispatcher + loop 兜底回填）。</text>

  <!-- footer -->
  <text x="48" y="866" font-size="11" fill="#94a3b8">@nova/core 模型无关：不导入任何模型 SDK / 工具实现 / UI —— 它们全部经由 HookRegistry 在外层装配。</text>
</svg>
